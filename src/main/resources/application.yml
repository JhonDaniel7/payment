spring:
  application:
    name: payment-service

  datasource:
    url: jdbc:postgresql://localhost:5436/payment_db
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true

server:
  port: ${SERVER_PORT:8083}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

security:
  jwt:
    # Base64, lo STESSO valore di product-service / order-service (stessa env var JWT_SECRET_KEY),
    # altrimenti i token emessi da product-service non vengono validati qui.
    # Il default è solo per sviluppo locale ed è identico a quello di order-service.
    secret-key: ${JWT_SECRET_KEY:5uQO3B7O2eQMsJ4d9p8Ms3xj6pBHVC+NiinRx764CAc=}
    expiration: 86400000
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# order-service: sorgente di verità per importo e stato dell'ordine
order-service:
  base-url: ${ORDER_SERVICE_BASE_URL:http://localhost:8081/ecommerce-bj}

gateway:
  culqi:
    base-url: ${CULQI_BASE_URL:https://api.culqi.com/v2}
    # Chiave privata del backend (NON la chiave pubblica usata dal frontend)
    api-key: ${CULQI_API_KEY:}
  nexi:
    # Sandbox: https://int-ecommerce.nexi.it/ecomm/api/phoenix-0.0/psp/api/v1
    # Production: https://xpay.nexigroup.com/api/phoenix-0.0/psp/api/v1
    base-url: ${NEXI_BASE_URL:https://int-ecommerce.nexi.it/ecomm/api/phoenix-0.0/psp/api/v1}
    api-key: ${NEXI_API_KEY:}
    # URL che Nexi chiama dopo il pagamento (deve essere raggiungibile da Internet — usa ngrok in locale)
    notification-url: ${NEXI_NOTIFICATION_URL:}
    # Dove Nexi reindirizza l'utente dopo il pagamento (frontend)
    result-url: ${NEXI_RESULT_URL:http://localhost:3000/payment/result}
    cancel-url: ${NEXI_CANCEL_URL:http://localhost:3000/payment/cancel}
  stripe:
    # Secret key del backend (sk_test_... / sk_live_...). MAI la publishable key (pk_...) e MAI esposta al frontend.
    # In locale puoi incollarla come default: ${STRIPE_SECRET_KEY:sk_test_xxx} — mai una chiave live in un file su git.
    secret-key: ${STRIPE_SECRET_KEY:}
    # Signing secret del webhook (whsec_...). In locale lo stampa `stripe listen --forward-to ...`.
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}

logging:
  level:
    com.microservices.payment: DEBUG
    org.springframework.security: INFO
